- block:
    - name: Create hammerspoon directories
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.hammerspoon/bin"
        state: directory
        mode: '0755'

    - name: Link hammerspoon config
      ansible.builtin.file:
        src: "{{ lookup('env', 'HOME') }}/dotfiles/config/apps/hammerspoon/init.lua"
        dest: "{{ lookup('env', 'HOME') }}/.hammerspoon/init.lua"
        state: link
        force: true

    - name: Build audio-activity helper
      ansible.builtin.command: >-
        swiftc -O
        {{ lookup('env', 'HOME') }}/dotfiles/config/apps/hammerspoon/audio-activity.swift
        -o {{ lookup('env', 'HOME') }}/.hammerspoon/bin/audio-activity
      changed_when: true
  when: ansible_facts['os_family'] == 'Darwin'
  tags: hammerspoon
